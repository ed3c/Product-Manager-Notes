name: M8 real-problem closure audit sync

on:
  push:
    branches:
      - audit/m8-real-problem-closure
    paths:
      - '.github/workflows/m8-real-problem-closure-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: m8-real-problem-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Compile source-to-closure audit
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import re
          from pathlib import Path

          START = '<!-- M8_REAL_PROBLEM_AUDIT_START -->'
          END = '<!-- M8_REAL_PROBLEM_AUDIT_END -->'

          def upsert(path: str, body: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8') if p.exists() else ''
              block = f'{START}\n{body.rstrip()}\n{END}\n'
              pattern = re.compile(re.escape(START) + r'.*?' + re.escape(END) + r'\n?', re.S)
              if pattern.search(text):
                  text = pattern.sub(block, text)
              else:
                  text = text.rstrip() + '\n\n' + block
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          audit = '''# M8 — REAL PROBLEM CLOSURE AUDIT

Status: `PASS_BOUNDED`

This audit classifies claims from the role/job description, articles, PDFs, repositories and technology candidates by the **real problem they imply**, then maps each problem to the merged Product/DevOps evidence graph. Source format is not evidence strength.

## Closure scale

```text
DESIGN_CLOSED              invariants / architecture / ADR accepted
REMOTE_DETERMINISTIC_CLOSED executable CI or bounded deterministic receipt exists
LOCAL_PHYSICAL_OPEN         bounded runner exists but real local receipt is absent
PRODUCTION_OPEN             no production observation or organizational admission
HUMAN_ADMIT_REQUIRED        employment / people / real-user evidence must be supplied by owner
```

A problem can be closed at one ceiling and still open at a higher ceiling.

## Real-problem closure matrix

| Real problem derived from sources | Closure criterion | Observed merged evidence | Verdict | Residual owner |
|---|---|---|---|---|
| Product requirements can drift from implementation | requirement→issue→PR→receipt traceability, exact subject and evidence ceiling | Product source/claim/gap routing + DevOps M1–M8 indexes | `REMOTE_DETERMINISTIC_CLOSED` | Product #4 for final narrative |
| Architecture claims can remain slideware | typed vertical slice, persistence/migration, immutable artifact and business oracle | FastAPI/Pydantic/PostgreSQL/SQLAlchemy/Alembic/Docker/K8s contracts merged | `REMOTE_DETERMINISTIC_CLOSED`; live K8s open | DevOps #2 |
| Infrastructure green can hide business failure | separate liveness/readiness and business oracle, negative control | forced business FAIL with infrastructure still healthy; reviewer packet | `REMOTE_DETERMINISTIC_CLOSED` | DevOps #2/#5 |
| Delivery lacks SLI/SLO and capacity proof | telemetry identity, metrics, workload/window and threshold receipt | OTel/Prometheus + bounded remote load; 1,000-VU runner contract | remote closed, `LOCAL_PHYSICAL_OPEN` for 1,000 VU | DevOps #3/#54 |
| Policy/security gates may be decorative | planted negative controls and fail-closed policy/scan evidence | OPA ± controls, Trivy, license metadata rejection | `REMOTE_DETERMINISTIC_CLOSED` at checked scope | DevOps #4; Human/legal for wider clearance |
| ML/model changes lack lifecycle and rollback | versioned model/prompt/config/data, offline eval, promotion gate, rejection and exact rollback | MLflow lifecycle + seeded canary rejection/rollback state machine | deterministic closed; local model/live delivery open | DevOps #7/#54 |
| GitOps/progressive delivery is claimed without controller runtime | controller ownership, exact manifests/digests, cleanup, then Application/Rollout evidence | self-contained ephemeral-kind Argo runner contract | `LOCAL_PHYSICAL_OPEN`; App reconcile/canary still open | DevOps #7/#54 |
| Supply-chain evidence is incomplete | SBOM, digest, scan, sign/verify, tamper rejection, registry-stored signature | Syft/Cosign/tamper evidence merged; local registry runner contract | remote closed; registry physical open | DevOps #10/#54 |
| Incident handling stops at mitigation | trigger→detect→authority→recover→postmortem→fix→same-failure re-test | seven deterministic DRILL scenarios and management/runbook artifacts | `REMOTE_DETERMINISTIC_CLOSED` as DRILL only | DevOps #5 for higher substrate |
| Reviewer cannot understand evidence without internal context | one bounded public reviewer flow and UI with exact receipts | Manager Demo Console + reviewer convergence | `REMOTE_DETERMINISTIC_CLOSED` | DevOps #9 for physical convergence |
| Parallel Agent work loses ownership/dependency semantics | path/resource leases, Git ancestry≠task DAG, molecular Stack and one convergence owner | skills-shared method + Stack v10 + README/AGENTS routing | `DESIGN_CLOSED` and repository-exercised | DevOps #67 for branch hygiene only |
| Local-only capabilities are falsely marked complete | canonical queue, one ACTIVE item, exact predecessor receipts and cleanup | PR #52 queue + M7 compiler + M8 handoff instructions | contract closed; `LOCAL_PHYSICAL_OPEN` | DevOps #2/#9/#54 |
| Commercial-use selection is treated as blanket clearance | permissive default, exact inventory and separate transitive/model/service admission | Product technology ADR + DevOps policy/license checks | `DESIGN_CLOSED`; blanket clearance forbidden | Product/DevOps #4 + Human/legal |
| Manager/job experience is inferred from portfolio code | exact separation of technical evidence and Human-admitted history | competency/evidence registries keep tenure/adoption/people evidence residual | `HUMAN_ADMIT_REQUIRED` | Product #4 / repository owner |

## State Machine

```text
SOURCE_CLAIM
→ REAL_PROBLEM_CLASSIFIED
→ CLOSURE_CRITERION_BOUND
→ PRODUCT_CONTRACT_BOUND
→ DEVOPS_EVIDENCE_REQUESTED
→ DESIGN_CLOSED | REMOTE_DETERMINISTIC_CLOSED
→ LOCAL_PHYSICAL_OPEN
→ LOCAL_RECEIPT_ADMITTED
→ PRODUCTION_OPEN | HUMAN_ADMIT_REQUIRED
→ INTERVIEW_CLAIM_ADMITTED
```

Current portfolio frontier:

```text
DESIGN_CLOSED + REMOTE_DETERMINISTIC_CLOSED
→ LOCAL_PHYSICAL_OPEN
```

## Evidence gaps that must remain visible

```text
local deterministic reviewer             NOT_EXERCISED
live kind/Kubernetes application smoke   NOT_EXERCISED
Argo controllers                         NOT_EXERCISED
Argo CD Application reconciliation       NOT_EXERCISED
live Rollouts canary                     NOT_EXERCISED
llama.cpp/model inference                NOT_EXERCISED
synthetic 1,000 VU                       NOT_EXERCISED
registry-stored signing                  NOT_EXERCISED
real production users/adoption           OUTSIDE_REPOSITORY_PROOF
real production incidents/tenure         OUTSIDE_REPOSITORY_PROOF
people-management tenure                 HUMAN_ADMIT_REQUIRED
```

## Source and mirror law

- Article/PDF/Repo/technology links are source inputs; they are never completion receipts.
- GitHub exact issues, merged PRs, executable checks and admitted receipts are canonical.
- Google Doc/Sheet may mirror URLs and narratives, but cannot promote a verdict.
- A closed issue records completion of its own bounded contract, not every higher evidence level.
'''
          Path('docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md').parent.mkdir(parents=True, exist_ok=True)
          Path('docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md').write_text(audit, encoding='utf-8')

          readme_pointer = r'''## M8 real-problem closure audit

Source formats are normalized into real problems before closure is evaluated. Read `docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md` for the problem→criterion→evidence→residual matrix. Current frontier is `DESIGN_CLOSED + REMOTE_DETERMINISTIC_CLOSED → LOCAL_PHYSICAL_OPEN`; production and Human experience evidence remain separate.
'''
          upsert('README.md', readme_pointer)

          agents_pointer = r'''## M8 source-closure audit law

Before declaring an Article/PDF/Repo/technology claim closed:

1. classify the real problem;
2. bind a falsifiable closure criterion;
3. identify the exact Product/DevOps evidence lane;
4. name the highest proven ceiling;
5. keep local, production and Human-admitted residuals explicit.

Read `docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md`. Source links, issue state, PR merge and Google mirrors cannot substitute for a missing runtime or Human receipt.
'''
          upsert('AGENTS.md', agents_pointer)

          index_pointer = r'''## M8 real-problem audit

`docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md` is the canonical public-safe problem→closure audit. It routes unresolved physical lanes to DevOps #2/#3/#4/#5/#7/#9/#10/#54/#67 and final interview/Human evidence to Product #4.
'''
          upsert('docs/INDEX.md', index_pointer)

          registry = {
              'schema_version': 'product-manager-notes/m8-real-problem-closure/v1',
              'verdict': 'PASS_BOUNDED',
              'frontier': ['DESIGN_CLOSED', 'REMOTE_DETERMINISTIC_CLOSED', 'LOCAL_PHYSICAL_OPEN'],
              'audit': 'docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md',
              'canonical_state': 'GITHUB',
              'google_mirrors': 'NON_AUTHORITATIVE',
              'open_devops_issues': [2, 3, 4, 5, 7, 9, 10, 54, 67],
              'open_product_convergence_issue': 4,
              'forbidden_promotions': [
                  'source_link_to_completion_receipt',
                  'merged_pr_to_physical_runtime',
                  'drill_to_production_incident',
                  '1000_vu_to_1000_real_users',
                  'portfolio_code_to_employment_or_people_management_tenure',
              ],
          }
          Path('registry/m8-real-problem-closure.json').write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('m8-real-problem-closure=PASS')
          PY

      - name: Commit audit surfaces
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/INDEX.md docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md registry/m8-real-problem-closure.json
          git commit -m 'docs: audit M8 real-problem closure across sources'
          git push origin HEAD:${{ github.ref_name }}
