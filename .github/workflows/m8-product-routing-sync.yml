name: M8 Product merged-evidence routing sync

on:
  push:
    branches:
      - audit/m8-merged-evidence-routing
    paths:
      - '.github/workflows/m8-product-routing-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: m8-product-routing-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact Product subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify merged DevOps frontier and Product issue states
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          from pathlib import Path
          from urllib import request

          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def github(url: str):
              req = request.Request(url, headers=headers)
              with request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          devops_pr = github('https://api.github.com/repos/ed3c/DevOps-Manager-Notes/pulls/70')
          assert devops_pr['merged'] is True and devops_pr['state'] == 'closed'

          for path in (
              'README.md',
              'AGENTS.md',
              'docs/milestones/PUBLIC_M8_MAIN_INTEGRATION_AND_HANDOFF_READY.md',
              'registry/public-m8-main-integration.json',
              'registry/closure-matrix.yaml',
              'handoff/LOCAL_HANDOFF_EXECUTION_QUEUE.md',
          ):
              payload = github(f'https://api.github.com/repos/ed3c/DevOps-Manager-Notes/contents/{path}?ref=main')
              assert payload.get('sha'), path

          product_closed = [1, 2, 3, 6, 7]
          product_open = [4, 12]
          observed = {'closed': {}, 'open': {}}
          for number in product_closed:
              issue = github(f'https://api.github.com/repos/ed3c/Product-Manager-Notes/issues/{number}')
              observed['closed'][str(number)] = issue['state']
              assert issue['state'] == 'closed', (number, issue['state'])
          for number in product_open:
              issue = github(f'https://api.github.com/repos/ed3c/Product-Manager-Notes/issues/{number}')
              observed['open'][str(number)] = issue['state']
              assert issue['state'] == 'open', (number, issue['state'])

          START = '<!-- M8_PRODUCT_ROUTING_START -->'
          END = '<!-- M8_PRODUCT_ROUTING_END -->'

          def upsert(path: str, body: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8') if p.exists() else ''
              block = f'{START}\n{body.rstrip()}\n{END}\n'
              pattern = re.compile(re.escape(START) + r'.*?' + re.escape(END) + r'\n?', re.S)
              if pattern.search(text):
                  text = pattern.sub(block, text)
              else:
                  text = text.rstrip() + '\n\n' + block
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          readme = r'''## M8 — merged DevOps evidence routing

```text
PRODUCT_M8_MERGED_EVIDENCE_ROUTING = PASS_BOUNDED
```

The Product control plane now routes to a merged, public DevOps executable plane through M8. Product artifacts remain requirements/decision/narrative authority; DevOps artifacts remain implementation/runtime/evidence authority. Google Doc and Google Sheet remain non-authoritative projections.

### Cross-repository State Machine

```text
SOURCE_ADMITTED
→ CLAIM_BOUND
→ REQUIREMENT_GAP_BOUND
→ PRODUCT_SYSTEM_CONTRACT_ADMITTED
→ DEVOPS_EVIDENCE_REQUESTED
→ REMOTE_EVIDENCE_BOUND
→ DEVOPS_MAIN_INTEGRATED                  current merged state
→ LOCAL_HANDOFF_PENDING                   current physical frontier
→ PHYSICAL_EVIDENCE_BOUND                 future
→ COMPETENCY_MATRIX_REVERIFIED            future
→ INTERVIEW_PACKET_READY                  future
```

`DEVOPS_MAIN_INTEGRATED` does not imply `PHYSICAL_EVIDENCE_BOUND`.

### Product → DevOps DAG and data flow

```text
Job / Article / PDF / Repo / Technology source
→ Product source + claim registries
→ requirement / competency / gap graph
→ PRD / invariant / architecture / ADR
→ DevOps issue + molecular PR + exact evidence request
→ merged DevOps M1–M8 implementation and traceability
→ canonical Local Handoff
→ physical receipt or explicit residual
→ Product competency/narrative update
→ Google Sheet / Doc mirrors
```

### Directory ownership

| Product directory | State-machine role | Downstream route |
|---|---|---|
| `roles/technical-product-manager/` | role contract and competency gap | DevOps evidence requests |
| `registry/sources.yaml`, `registry/claims.yaml` | source/claim admission | requirement graph |
| `registry/evidence.yaml`, `registry/gaps.yaml` | evidence/residual authority | issue/PR/receipt routing |
| `docs/architecture/`, `docs/case-studies/` | Product/System Design and decisions | DevOps implementation contract |
| `prompts/` | P0–P7 zero-context orchestration | bounded worker sessions |
| Google links | dashboard/narrative projection | never canonical |

### Integrated and residual closure

```text
Product evidence audit / system design / failure library / MVP contract / technology ADR
  COMPLETE_AT_BOUNDED_CONTRACT_CEILING

DevOps remote implementation / failure-recovery / reviewer / main integration
  COMPLETE_AT_M8_REMOTE_AND_ROUTING_CEILING

local reviewer / kind / Argo / model / 1000-VU / registry signing
  NOT_EXERCISED

employment tenure / TPM tenure / direct reports / real users / production incidents
  HUMAN_ADMIT_REQUIRED | OUTSIDE_REPOSITORY_PROOF
```

Product issue #4 remains the sole interview-evidence convergence owner until both physical and Human-admitted residuals are handled.
'''
          upsert('README.md', readme)

          agents = r'''## M8 merged-evidence routing contract

Mandatory read order for interview/portfolio convergence:

```text
README.md
→ AGENTS.md
→ docs/milestones/M8_MERGED_EVIDENCE_ROUTING.md
→ registry/m8-merged-evidence-routing.json
→ registry/product-closure-matrix.yaml
→ exact Product issue/PR
→ exact DevOps M8 issue/PR/receipt
```

Routing laws:

- Product may classify requirements, decisions, competency gaps and narrative claims; it may not fabricate executable evidence.
- DevOps merged-main or CI evidence may satisfy only its named evidence ceiling.
- Fixture, DRILL, local Kubernetes, synthetic 1,000 VU and local model/signing evidence cannot become production or tenure claims.
- Issue #4 stays open until physical Local Handoff receipts and Human-admitted experience evidence are separately resolved.
- Google Doc/Sheet may mirror status and URLs but may not advance a GitHub state or evidence verdict.
- A closed Product issue means its own bounded contract is complete; it does not close higher physical or Human evidence edges.

Shadow Architect remains `MODE=MONITOR` and blocks stale subjects, cross-plane authority drift, private disclosure, evidence laundering, unsupported resume claims, or ambiguous merge/runtime identity.
'''
          upsert('AGENTS.md', agents)

          index = r'''## M8 Product routing

```text
README.md
→ AGENTS.md
→ docs/milestones/M8_MERGED_EVIDENCE_ROUTING.md
→ registry/m8-merged-evidence-routing.json
→ registry/product-closure-matrix.yaml
→ DevOps M8 main-integration milestone
→ DevOps Local Handoff queue
→ Product issue #4
```
'''
          upsert('docs/INDEX.md', index)

          milestone = '''# M8 — MERGED DEVOPS EVIDENCE ROUTING

Status: `PASS_BOUNDED`

The public Product control plane is integrated with the merged DevOps M8 evidence frontier. Requirements, decisions, gaps and narratives remain Product-owned; executable implementation and receipts remain DevOps-owned.

## Current frontier

```text
Product bounded contracts            MERGED
DevOps remote/main integration        PASS_BOUNDED
physical Local Handoff               NOT_EXERCISED
Human experience admission           REQUIRED
interview-ready convergence           OPEN (#4)
```

No repository artifact alone proves employment tenure, TPM/program tenure, direct reports, production adoption or real incident history.
'''
          Path('docs/milestones/M8_MERGED_EVIDENCE_ROUTING.md').write_text(milestone, encoding='utf-8')

          registry = {
              'schema_version': 'product-manager-notes/m8-merged-evidence-routing/v1',
              'verdict': 'PASS_BOUNDED',
              'product_subject': {
                  'repository': 'ed3c/Product-Manager-Notes',
                  'branch': os.environ['SOURCE_BRANCH'],
                  'commit': os.environ['SOURCE_COMMIT'],
              },
              'devops_subject': {
                  'repository': 'ed3c/DevOps-Manager-Notes',
                  'branch': 'main',
                  'milestone': 'PUBLIC_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_READY',
                  'integration_pull_request': 70,
              },
              'product_issue_snapshot': observed,
              'closed_product_contracts': [1, 2, 3, 6, 7],
              'open_convergence_issue': 4,
              'physical_runtime_state': 'NOT_EXERCISED',
              'human_experience_state': 'HUMAN_ADMIT_REQUIRED',
              'google_mirror_authority': 'NON_AUTHORITATIVE',
              'evidence_ceiling': 'PRODUCT_REQUIREMENT_DECISION_AND_ROUTING_ONLY',
          }
          Path('registry/m8-merged-evidence-routing.json').write_text(json.dumps(registry, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          matrix = '''schema_version: product-manager-notes/product-closure-matrix/v1
milestone: M8
closed_completed:
  - {issue: 1, scope: bounded_evidence_audit}
  - {issue: 2, scope: product_and_system_design_contract}
  - {issue: 3, scope: failure_and_decision_library}
  - {issue: 6, scope: full_manager_mvp_acceptance_contract}
  - {issue: 7, scope: technology_and_commercial_use_adr}
keep_open:
  - issue: 4
    reason: physical_receipts_and_human_experience_admission_incomplete
boundaries:
  github: canonical
  google_sheet_doc: non_authoritative_projection
  repository_evidence_cannot_prove_employment_or_people_management_tenure: true
'''
          Path('registry/product-closure-matrix.yaml').write_text(matrix, encoding='utf-8')
          print('product-m8-routing-compiled=PASS')
          PY

      - name: Commit compiled Product routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md docs/INDEX.md docs/milestones/M8_MERGED_EVIDENCE_ROUTING.md \
            registry/m8-merged-evidence-routing.json registry/product-closure-matrix.yaml
          git commit -m 'docs: bind merged DevOps M8 evidence routing'
          git push origin HEAD:${{ github.ref_name }}
