version: 1
evidence_states:
  - PASS
  - FAIL
  - ABSENT
  - NOT_IMPLEMENTED
  - NOT_EXERCISED
  - SKIPPED_BY_POLICY
  - HUMAN_ADMIT_REQUIRED
ladder:
  L0: SOURCE_CLAIM
  L1: STATIC_REASONING
  L2: DETERMINISTIC_TEST
  L3: LOCAL_INTEGRATION
  L4: REAL_SUBSTRATE
  L5: ADVERSARIAL_OR_CHAOS
  L6: PRODUCTION_OBSERVATION
records: []
rules:
  - lower evidence never promotes itself into a higher lane
  - exact subject, revision and environment must be bound before PASS
  - load-test virtual users never prove real adoption
  - simulation and drills never prove production incident history
