rules:
  - lower evidence never promotes itself into a higher lane
  - exact subject, revision and environment must be bound before PASS
  - load-test virtual users never prove real adoption
  - simulation and drills never prove production incident history
  - repository evidence cannot prove employment tenure without independent Human evidence
  - evidence PASS closes only the named narrow subclaim, not the whole job requirement
