version: 4
method_owner: ed3c/skills-shared/skills/git-town-stacked-pr-worker
consumer: ed3c/Product-Manager-Notes

policy:
  branch_or_pr_must_exist_before_identity_is_recorded: true
  true_child_requires_unmerged_artifact_consumption: true
  path_disjoint_work_should_remain_sibling: true
  cross_repository_evidence_does_not_create_git_ancestry: true
  one_convergence_owner_per_shared_surface: true
  merge_release_promotion_human_owned: true
  start_readiness_is_not_completion_readiness: true
  first_green_is_not_full_closure: true
  current_head_is_not_historical_evidence_head: true
  issue_state_is_not_capability_evidence: true
  merged_pr_is_not_physical_runtime_evidence: true
  google_projection_is_not_evidence_authority: true

atoms:
  - id: C0-bootstrap-contract
    atom: C
    pull_request: 5
    state: MERGED
    stack_class: root
    provides_artifacts:
      - manager-evidence-contract-v1
      - job-contract-v1
      - stage-program-v1

  - id: C6-full-mvp-product-contract
    atom: C
    issues: [6, 7]
    pull_request: 8
    state: MERGED
    stack_class: true_child
    git_parent: C0-bootstrap-contract
    provides_artifacts:
      - full-manager-mvp-product-contract-v1
      - technology-adr-v1
      - devops-routing-contract-v1

  - id: E1-tpm-evidence-audit
    atom: E
    issues: [1]
    pull_request: 9
    state: MERGED_VIA_PR_13
    stack_class: exact_side_input
    merge_integration_pull_request: 13
    owns_paths:
      - docs/evidence-audit/TPM_EXISTING_EVIDENCE_AUDIT.md
      - registry/evidence.yaml
      - registry/gaps.yaml
      - roles/technical-product-manager/competency-matrix.yaml
    residuals:
      - EMPLOYMENT_TENURE_HUMAN_ADMIT_REQUIRED
      - TPM_PROGRAM_TENURE_HUMAN_ADMIT_REQUIRED
      - REAL_SCALE_AND_ADOPTION_HUMAN_ADMIT_REQUIRED

  - id: D11-public-disclosure-alignment
    atom: D
    issues: [10]
    pull_request: 11
    state: MERGED
    stack_class: true_child
    git_parent: C6-full-mvp-product-contract
    provides_artifacts:
      - public-disclosure-contract-v1
      - docs/PUBLIC_DISCLOSURE_CHECKLIST.md

  - id: D12-public-m4-routing
    atom: D
    issues: [4]
    pull_request: 12
    state: MERGED_HISTORICAL_ROUTING
    stack_class: true_child
    git_parent: D11-public-disclosure-alignment
    exact_side_inputs:
      - {repository: ed3c/Product-Manager-Notes, pull_request: 9, mode: exact_evidence_reference}
      - {repository: ed3c/DevOps-Manager-Notes, pull_request: 44, mode: external_exact_evidence}
      - {repository: ed3c/DevOps-Manager-Notes, pull_request: 45, mode: process_dependency_local_handoff}
    provides_artifacts:
      - public-manager-m4-routing-v1
      - bounded-manager-interview-story-v1
    note: historical route; not the current M8 frontier

  - id: D15-m8-audit-preparation
    atom: D
    issues: [14, 16]
    pull_request: 15
    state: MERGED_PREPARATION_SUPERSEDED_BY_M8_DURABLE_CONVERGENCE
    stack_class: documentation_preparation
    blockers_resolved_by: X8-product-m8-durable-routing

  - id: D17-product-closure-preparation
    atom: D
    issues: [4, 16]
    pull_request: 17
    state: MERGED_PREPARATION_SUPERSEDED_BY_M8_DURABLE_CONVERGENCE
    stack_class: registry_preparation
    blockers_resolved_by: X8-product-m8-durable-routing

  - id: H20-m8-one-shot-workflow-cleanup
    atom: H
    pull_request: 20
    state: MERGED
    stack_class: hygiene_leaf
    merge_commit: 73bb702447c496ab43428126808b1cac40c9a2d2
    removed_paths:
      - .github/workflows/m8-product-routing-sync.yml
      - .github/workflows/m8-real-problem-closure-sync.yml
    evidence_effect: NONE

  - id: X8-product-m8-durable-routing
    atom: X
    issues: [4, 16]
    pull_request: null
    state: BRANCH_OPEN_PR_PENDING
    stack_class: convergence
    branch: audit/m8-durable-main-routing
    base_branch: main
    base_commit: 73bb702447c496ab43428126808b1cac40c9a2d2
    owns_paths:
      - README.md
      - AGENTS.md
      - docs/INDEX.md
      - docs/milestones/M8_MERGED_EVIDENCE_ROUTING.md
      - docs/audits/M8_REAL_PROBLEM_CLOSURE_AUDIT.md
      - registry/m8-merged-evidence-routing.json
      - registry/m8-real-problem-closure.json
      - registry/product-closure-matrix.yaml
      - registry/stack-plan.yaml
      - .github/workflows/m8-durable-routing-audit.yml
    exact_side_inputs:
      - repository: ed3c/DevOps-Manager-Notes
        branch: main
        commit: 5d0c5db1626bf5c1a83334ea864b6a3eb7613df3
        tree: abd7fa38e9aa7ca720d9f110559a1f05b05c2023
        mode: external_merged_evidence
      - repository: ed3c/DevOps-Manager-Notes
        commit: e7b4e23799a3579572598ebd5864a80831d49db4
        tree: 0b72b9f09f73d3829db2f138d457a5691641bf79
        mode: process_dependency_local_handoff
    provides_artifacts:
      - product-m8-merged-evidence-routing-v2
      - product-m8-real-problem-closure-v2
      - product-closure-matrix-v3
      - product-m8-zero-context-agent-contract
    completion_after_merge:
      close_issue: 16
      keep_open_issue: 4
    evidence_ceiling: PRODUCT_REQUIREMENT_DECISION_ROUTING_AND_CLOSURE_AUDIT_ONLY
    blockers:
      - PR_IDENTITY_PENDING
      - PR_VALIDATION_PENDING
      - HUMAN_ADMIT_MERGE

external_devops_frontier:
  repository: ed3c/DevOps-Manager-Notes
  main_commit: 5d0c5db1626bf5c1a83334ea864b6a3eb7613df3
  main_tree: abd7fa38e9aa7ca720d9f110559a1f05b05c2023
  milestone: PUBLIC_MAIN_INTEGRATION_AND_LOCAL_HANDOFF_READY
  local_handoff:
    commit: e7b4e23799a3579572598ebd5864a80831d49db4
    tree: 0b72b9f09f73d3829db2f138d457a5691641bf79
    rollback_commit: bb940bf7d5a3b1f605b79e9fb8f33c463a8ee5a7
    active_item: M8-LOCAL-REVIEWER-001
    runtime_state: NOT_EXERCISED

open_completion_edges:
  product_issue_4:
    state: KEEP_OPEN
    missing:
      - local_reviewer_receipt
      - live_kind_receipt
      - advanced_local_receipts
      - employment_and_people_management_human_admission
      - real_user_and_production_incident_admission
  product_issue_16:
    state: CLOSE_AFTER_X8_MERGE

notes:
  - PR #8 is a true child of PR #5 because it consumed the unmerged Manager Evidence Graph contract.
  - PR #9 is an evidence side input and was integrated without fabricating a multi-parent relationship.
  - PR #12 remains historical M4 routing; X8 is the current M8 shared-surface convergence owner.
  - PR #15/#17 preparation is superseded only for durable M8 documentation/registry ownership; their historical commits remain observable.
  - PR #20 removed write-capable one-shot workflows and changed no evidence verdict.
  - DevOps main and Local Handoff subjects are typed external/process dependencies, never Product Git parents.
  - Issue #16 may close only after X8 is merged and durable artifacts are read back from main.
  - Issue #4 remains open until physical and Human-admitted edges are separately resolved.
